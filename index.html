<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PONG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    color: #fff;
    overflow: hidden;
    user-select: none;
  }
  #screen {
    position: relative;
    width: 800px;
    height: 500px;
  }
  canvas {
    display: block;
    border: 2px solid #fff;
    box-shadow: 0 0 30px rgba(255,255,255,0.15), 0 0 60px rgba(255,255,255,0.05);
  }
  /* CRT overlay */
  canvas::after { content:''; }
  #crt {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.07) 0px,
      rgba(0,0,0,0.07) 1px,
      transparent 1px,
      transparent 2px
    );
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
  }
  #overlay h1 {
    font-size: 64px;
    letter-spacing: 16px;
    text-shadow: 0 0 20px #fff;
    margin-bottom: 8px;
  }
  #overlay .sub { font-size: 13px; letter-spacing: 4px; color: #aaa; margin-bottom: 40px; }
  .diff-label { font-size: 13px; letter-spacing: 3px; color: #aaa; margin-bottom: 14px; }
  .diff-btns { display: flex; gap: 16px; margin-bottom: 40px; }
  .diff-btn {
    background: transparent;
    border: 1px solid #555;
    color: #aaa;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 10px 24px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .diff-btn:hover, .diff-btn.active {
    border-color: #fff;
    color: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .start-btn {
    background: #fff;
    color: #000;
    border: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 4px;
    padding: 14px 40px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .start-btn:hover { box-shadow: 0 0 20px rgba(255,255,255,0.5); }
  #gameover {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
  }
  #gameover h2 { font-size: 36px; letter-spacing: 8px; text-shadow: 0 0 20px #fff; margin-bottom: 12px; }
  #gameover .result { font-size: 14px; letter-spacing: 3px; color: #aaa; margin-bottom: 40px; }
</style>
</head>
<body>
<div id="screen">
  <canvas id="c" width="800" height="500"></canvas>
  <div id="crt"></div>

  <!-- Start overlay -->
  <div id="overlay">
    <h1>PONG</h1>
    <div class="sub">MOVE MOUSE TO CONTROL YOUR PADDLE</div>
    <div class="diff-label">SELECT DIFFICULTY</div>
    <div class="diff-btns">
      <button class="diff-btn" data-d="easy">EASY</button>
      <button class="diff-btn active" data-d="medium">MEDIUM</button>
      <button class="diff-btn" data-d="hard">HARD</button>
    </div>
    <button class="start-btn" id="startBtn">START GAME</button>
  </div>

  <!-- Game over overlay -->
  <div id="gameover">
    <h2 id="goTitle"></h2>
    <div class="result" id="goSub"></div>
    <button class="start-btn" id="replayBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const gameoverDiv = document.getElementById('gameover');

// Difficulty settings: [aiSpeed factor, errorMargin px, reactionDelay]
const DIFF = {
  easy:   { spd: 0.045, err: 55, delay: 18 },
  medium: { spd: 0.07,  err: 25, delay: 10 },
  hard:   { spd: 0.13,  err: 6,  delay: 3  }
};
let diff = 'medium';
let running = false;

// Diff buttons
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    diff = btn.dataset.d;
  });
});

// Game state
const PAD_W = 12, PAD_H = 80, BALL_SIZE = 10;
const WIN_SCORE = 7;
let playerY, aiY, ballX, ballY, bvx, bvy;
let playerScore = 0, aiScore = 0;
let aiTargetY, aiDelayCounter = 0;
let mouseY = H / 2;
let flashTimer = 0;
let particles = [];

// Track mouse relative to canvas
document.getElementById('screen').addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseY = e.clientY - rect.top;
});

function resetBall(dir = 1) {
  ballX = W / 2; ballY = H / 2;
  const angle = (Math.random() * 0.6 - 0.3);
  const spd = 5.5;
  bvx = dir * spd * Math.cos(angle);
  bvy = spd * Math.sin(angle);
  aiTargetY = H / 2;
}

function initGame() {
  playerY = H / 2 - PAD_H / 2;
  aiY = H / 2 - PAD_H / 2;
  playerScore = 0; aiScore = 0;
  particles = [];
  resetBall(Math.random() < 0.5 ? 1 : -1);
}

function spawnParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 4 + 1;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 1 });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.05; p.vx *= 0.95; p.vy *= 0.95; });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#fff';
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });
  ctx.globalAlpha = 1;
}

function update() {
  if (!running) return;

  // Player paddle follows mouse
  playerY = Math.max(0, Math.min(H - PAD_H, mouseY - PAD_H / 2));

  // AI paddle
  const cfg = DIFF[diff];
  aiDelayCounter++;
  if (aiDelayCounter >= cfg.delay) {
    aiDelayCounter = 0;
    // Predict with error
    aiTargetY = ballY - PAD_H / 2 + (Math.random() * cfg.err * 2 - cfg.err);
  }
  const aiCenter = aiY + PAD_H / 2;
  const aiDist = aiTargetY + PAD_H/2 - aiCenter;
  aiY += aiDist * cfg.spd * (bvx < 0 ? 1.4 : 0.7);
  aiY = Math.max(0, Math.min(H - PAD_H, aiY));

  // Ball movement
  ballX += bvx; ballY += bvy;

  // Wall bounce top/bottom
  if (ballY <= 0) { ballY = 0; bvy = Math.abs(bvy); }
  if (ballY >= H - BALL_SIZE) { ballY = H - BALL_SIZE; bvy = -Math.abs(bvy); }

  // Player paddle (right side)
  const px = W - 30 - PAD_W;
  if (bvx > 0 && ballX + BALL_SIZE >= px && ballX < px + PAD_W &&
      ballY + BALL_SIZE >= playerY && ballY <= playerY + PAD_H) {
    ballX = px - BALL_SIZE;
    const rel = (ballY + BALL_SIZE/2 - (playerY + PAD_H/2)) / (PAD_H/2);
    const angle = rel * 1.1;
    const spd = Math.min(Math.sqrt(bvx*bvx + bvy*bvy) * 1.04, 14);
    bvx = -spd * Math.cos(angle);
    bvy = spd * Math.sin(angle);
    spawnParticles(px, ballY + BALL_SIZE/2);
    flashTimer = 4;
  }

  // AI paddle (left side)
  const ax = 30;
  if (bvx < 0 && ballX <= ax + PAD_W && ballX + BALL_SIZE > ax &&
      ballY + BALL_SIZE >= aiY && ballY <= aiY + PAD_H) {
    ballX = ax + PAD_W;
    const rel = (ballY + BALL_SIZE/2 - (aiY + PAD_H/2)) / (PAD_H/2);
    const angle = rel * 1.1;
    const spd = Math.min(Math.sqrt(bvx*bvx + bvy*bvy) * 1.04, 14);
    bvx = spd * Math.cos(angle);
    bvy = spd * Math.sin(angle);
    spawnParticles(ax + PAD_W, ballY + BALL_SIZE/2);
    flashTimer = 4;
  }

  // Scoring
  if (ballX < 0) {
    playerScore++;
    spawnParticles(30, ballY);
    if (playerScore >= WIN_SCORE) { endGame(true); return; }
    resetBall(1);
  }
  if (ballX > W) {
    aiScore++;
    spawnParticles(W - 30, ballY);
    if (aiScore >= WIN_SCORE) { endGame(false); return; }
    resetBall(-1);
  }

  if (flashTimer > 0) flashTimer--;
  updateParticles();
}

function draw() {
  // Flash effect on hit
  ctx.fillStyle = flashTimer > 0 ? '#111' : '#000';
  ctx.fillRect(0, 0, W, H);

  // Center dashed line
  ctx.setLineDash([10, 14]);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);

  // Scores
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.font = 'bold 80px Share Tech Mono';
  ctx.textAlign = 'center';
  ctx.fillText(aiScore, W/2 - 120, 90);
  ctx.fillText(playerScore, W/2 + 120, 90);

  // Labels
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = '11px Share Tech Mono';
  ctx.fillText('CPU', W/2 - 120, 110);
  ctx.fillText('YOU', W/2 + 120, 110);

  // Paddles (rounded rect)
  ctx.fillStyle = '#fff';
  const px = W - 30 - PAD_W;
  roundRect(ctx, px, playerY, PAD_W, PAD_H, 4);
  roundRect(ctx, 30, aiY, PAD_W, PAD_H, 4);

  // Ball
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 12;
  ctx.fillRect(ballX, ballY, BALL_SIZE, BALL_SIZE);
  ctx.shadowBlur = 0;

  drawParticles();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  overlay.style.display = 'none';
  gameoverDiv.style.display = 'none';
  initGame();
  running = true;
}

function endGame(playerWon) {
  running = false;
  gameoverDiv.style.display = 'flex';
  document.getElementById('goTitle').textContent = playerWon ? 'YOU WIN!' : 'CPU WINS';
  document.getElementById('goSub').textContent = `${playerScore} — ${aiScore}`;
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('replayBtn').addEventListener('click', () => {
  gameoverDiv.style.display = 'none';
  overlay.style.display = 'flex';
});

loop();
</script>
</body>
</html>
